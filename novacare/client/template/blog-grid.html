{% extends 'header.html' %}
{% load static %}
{% block content %}

    <!-- Breadcrumbs -->
    <div class="breadcrumbs overlay">
      <div class="container">
        <div class="bread-inner">
          <div class="row">
            <div class="col-12">
              <h2>Blog Grid</h2>
              <ul class="bread-list">
                <li><a href="index.html">Home</a></li>
                <li><i class="icofont-simple-right"></i></li>
                <li class="active">Blog Grid</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End Breadcrumbs -->

    <!-- Single News -->
    <section class="blog grid section">
      <div class="container">
        <div class="row">
          <div class="col-lg-8 col-12">
            <div class="row">
              
              
              {% for data in gallery %}
              
              <div class="col-lg-6 col-md-6 col-12">
                <!-- Single Blog -->
                <div class="single-news">
                  <div class="news-head">
                    <img src="{{ data.Image.url }}" alt="#" />
                  </div>
                  <div class="news-body">
                    
                  </div>
                </div>
                <!-- End Single Blog -->
              </div>
                   
              {% endfor %}

                </div>
                <!-- End Single Blog -->
              </div>
              <div class="col-12">
                
              </div>
            </div>
          </div>
          
    </section>
    <!--/ End Single News -->

     {% endblock %}
