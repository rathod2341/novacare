{% extends 'header.html' %}
{% load static %}
{% block content %}

    <!-- Breadcrumbs -->
    <div class="breadcrumbs overlay">
      <div class="container">
        <div class="bread-inner">
          <div class="row">
            <div class="col-12">
              <h2>Register</h2>
              <ul class="bread-list">
                <li><a href="index.html">Home</a></li>
                <li><i class="icofont-simple-right"></i></li>
                <li class="active">Register</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End Breadcrumbs -->

    <!-- Shop Register -->
    <section class="register section">
      <div class="container">
        <div class="inner">
          <div class="row">
            <div class="col-lg-6">
              <div class="register-left"></div>
            </div>
            <div class="col-lg-6">
              <div class="register-form">
                <h2>Register Here</h2>
                <p>
                  <a href="login.html">Login Here</a>
                </p>
                <!-- Form -->
                <form class="form" method="post" action="/login/">
                  {% csrf_token %}
                    <div class="col-lg-6">
                      <div class="form-group">
                        <input
                          type="user name"
                          name="user name"
                          placeholder="user Name"
                          required=""
                        />
                      </div>
                    </div>

                  
                      
                    <div class="col-lg-6">
                      <div class="form-group">
                        <input
                          type="email"
                          name="email"
                          placeholder="email"
                          required=""
                        />
                      </div>
                    </div>
                    <div class="col-lg-6">
                      <div class="form-group">
                        <input
                          type="password"
                          name="password"
                          placeholder="password"
                          required=""
                        />
                      </div>
                    </div>
                  
                    <div class="col-12">
                      <div class="form-group Appointment-btn">
                        <button class="btn" type="submit">book  an Appointment</button>
                      </div>
                      <div class="checkbox">
                        <label class="checkbox-inline" for="2"
                          ><input name="news" id="2" type="checkbox" />Yes, I
                          agree with all</label
                        >
                      </div>
                      <a href="#" class="terms">Terms & Conditions</a>
                    </div>
                  </div>
                </form>
                <!--/ End Form -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--/ End Register -->



    <!-- jquery Min JS -->
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <!-- jquery Migrate JS -->
    <script src="{% static 'js/jquery-migrate.js' %}"></script>
    <!-- Easing JS -->
    <script src="{% static 'js/easing.js' %}"></script>
    <!-- Color JS -->
    <script src="{% static 'js/colors.js' %}"></script>
    <!-- Popper JS -->
    <script src="{% static 'js/popper.min.js' %}"></script>
    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <!-- Bootstrap Datepicker JS -->
    <script src="{% static 'js/bootstrap-datepicker.js' %}"></script>
    <!-- Jquery Nav JS -->
    <script src="{% static 'js/jquery.nav.js' %}"></script>
    <!-- Slicknav JS -->
    <script src="{% static 'js/slicknav.min.js' %}"></script>
    <!-- ScrollUp JS -->
    <script src="{% static 'js/jquery.scrollUp.min.js' %}"></script>
    <!-- Niceselect JS -->
    <script src="{% static 'js/niceselect.js' %}"></script>
    <!-- Tilt Jquery JS -->
    <script src="{% static 'js/tilt.jquery.min.js' %}"></script>
    <!-- Owl Carousel JS -->
    <script src="{% static 'js/owl-carousel.js' %}"></script>
    <!-- counterup JS -->
    <script src="{% static 'js/jquery.counterup.min.js' %}"></script>
    <script src="{% static 'js/waypoints.min.js' %}"></script>
    <!-- Steller JS -->
    <script src="{% static 'js/steller.js' %}"></script>
    <!-- Wow JS -->
    <script src="{% static 'js/wow.min.js' %}"></script>
    <!-- Magnific Popup JS -->
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <!-- Main JS -->
    <script src="{% static 'js/main.js' %}"></script>
  </body>

</html>

{% endblock %}
